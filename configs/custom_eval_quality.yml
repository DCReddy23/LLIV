# Higher-quality (slower) sampling config for stage2 inference.
# Difference vs custom_eval.yml: more sampling steps.

data:
    type: "LLdataset"
    train_dataset: "unpaired"
    val_dataset: "custom"
    patch_size: 512
    channels: 3
    num_workers: 0
    data_dir: "demo_data"
    ckpt_dir: "ckpt/stage2"
    conditional: True

model:
    in_channels: 3
    out_ch: 3
    ch: 64
    ch_mult: [1, 2, 3, 4]
    num_res_blocks: 2
    dropout: 0.0
    ema_rate: 0.999
    ema: True
    resamp_with_conv: True

diffusion:
    beta_schedule: linear
    beta_start: 0.0001
    beta_end: 0.02
    num_diffusion_timesteps: 1000
    # Default was 20; increasing improves quality but is slower.
    num_sampling_timesteps: 50

training:
    batch_size: 12
    n_epochs: 100
    validation_freq: 2000

sampling:
    batch_size: 1

optim:
    weight_decay: 0.000
    optimizer: "Adam"
    lr: 0.00002
    amsgrad: False
    eps: 0.00000001
